name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: libsql://ci.invalid
  DATABASE_AUTH_TOKEN: ci-placeholder
  SENDGRID_API_KEY: ci-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DISCORD_CLIENT_ID: ci-placeholder
  DISCORD_CLIENT_SECRET: ci-placeholder
  GOOGLE_CLIENT_ID: ci-placeholder
  GOOGLE_CLIENT_SECRET: ci-placeholder
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check, lint, typecheck and test the root app in parallel
        run: |
          checks=(format:check lint typecheck test)
          pids=()
          for check in "${checks[@]}"; do
            pnpm "$check" > "$RUNNER_TEMP/root-$check.log" 2>&1 &
            pids+=("$!")
          done
          status=0
          for index in "${!checks[@]}"; do
            check=${checks[$index]}
            if wait "${pids[$index]}"; then result=passed; else result=failed; status=1; fi
            echo "::group::$check ($result)"
            cat "$RUNNER_TEMP/root-$check.log"
            echo "::endgroup::"
            if [ "$result" = failed ]; then echo "::error::Root $check failed"; fi
          done
          exit $status
      - name: Build the root app (lint already ran above)
        run: pnpm exec next build --no-lint
  worker-suites:
    name: worker (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    strategy:
      fail-fast: false
      matrix:
        suite: [browser, library, static]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anihub/worker prepare:types
      - run: pnpm --filter @anihub/worker build
      - if: matrix.suite == 'browser'
        run: pnpm --filter @anihub/worker test:browser
      - if: matrix.suite == 'library'
        run: pnpm --filter @anihub/worker test:library
      - name: Worker typecheck, unit tests and bundle check
        if: matrix.suite == 'static'
        run: |
          checks=(typecheck unit bundle)
          run_check() {
            case $1 in
              typecheck) pnpm --filter @anihub/worker exec tsc --noEmit ;;
              unit) pnpm --filter @anihub/worker test ;;
              bundle) pnpm --filter @anihub/worker check:bundle ;;
            esac
          }
          pids=()
          for check in "${checks[@]}"; do
            { code=0; run_check "$check" > "$RUNNER_TEMP/$check.log" 2>&1 || code=$?; echo "$code" > "$RUNNER_TEMP/$check.status"; } &
            pids+=("$!")
          done
          status=0
          for index in "${!checks[@]}"; do
            check=${checks[$index]}
            wait "${pids[$index]}" || true
            echo "::group::$check"
            cat "$RUNNER_TEMP/$check.log"
            echo "::endgroup::"
            if [ "$(cat "$RUNNER_TEMP/$check.status")" != 0 ]; then
              echo "::error::Worker $check failed"
              status=1
            fi
          done
          exit $status
  worker:
    needs: worker-suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "Worker typecheck, unit tests, bundle and browser suites passed."
