name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: libsql://ci.invalid
  DATABASE_AUTH_TOKEN: ci-placeholder
  SENDGRID_API_KEY: ci-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DISCORD_CLIENT_ID: ci-placeholder
  DISCORD_CLIENT_SECRET: ci-placeholder
  GOOGLE_CLIENT_ID: ci-placeholder
  GOOGLE_CLIENT_SECRET: ci-placeholder
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  worker:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anihub/worker prepare:types
      - name: Start Worker unit tests in the background
        run: |
          (pnpm --filter @anihub/worker test > "$RUNNER_TEMP/unit.log" 2>&1; echo $? > "$RUNNER_TEMP/unit.status") &
      - name: Typecheck and build the Worker in parallel
        run: |
          pnpm --filter @anihub/worker exec tsc --noEmit &
          typecheck=$!
          pnpm --filter @anihub/worker build
          wait "$typecheck"
      - run: '"$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version'
      - run: pnpm --filter @anihub/worker test:browser
      - run: pnpm --filter @anihub/worker test:library
      - run: pnpm --filter @anihub/worker check:bundle
      - name: Worker unit test results
        if: always()
        run: |
          timeout 300 bash -c 'until [ -f "$RUNNER_TEMP/unit.status" ]; do sleep 1; done'
          cat "$RUNNER_TEMP/unit.log"
          exit "$(cat "$RUNNER_TEMP/unit.status")"
