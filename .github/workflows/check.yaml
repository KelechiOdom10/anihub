name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: libsql://ci.invalid
  DATABASE_AUTH_TOKEN: ci-placeholder
  SENDGRID_API_KEY: ci-placeholder
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DISCORD_CLIENT_ID: ci-placeholder
  DISCORD_CLIENT_SECRET: ci-placeholder
  GOOGLE_CLIENT_ID: ci-placeholder
  GOOGLE_CLIENT_SECRET: ci-placeholder
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build the root app (lint already ran above)
        run: pnpm exec next build --no-lint
  worker:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anihub/worker prepare:types
      - run: pnpm --filter @anihub/worker build
      - name: Start Worker typecheck, unit tests and bundle check in the background
        id: background
        run: |
          run_bg() {
            name=$1
            shift
            ("$@" > "$RUNNER_TEMP/$name.log" 2>&1; echo $? > "$RUNNER_TEMP/$name.status") > /dev/null 2>&1 &
          }
          run_bg chrome "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
          run_bg typecheck pnpm --filter @anihub/worker exec tsc --noEmit
          run_bg unit pnpm --filter @anihub/worker test
          run_bg bundle pnpm --filter @anihub/worker check:bundle
      - run: pnpm --filter @anihub/worker test:browser
      - run: pnpm --filter @anihub/worker test:library
      - name: Background Worker check results
        if: always() && steps.background.outcome == 'success'
        run: |
          status=0
          for check in chrome typecheck unit bundle; do
            if ! timeout 300 bash -c "until [ -f '$RUNNER_TEMP/$check.status' ]; do sleep 1; done"; then
              echo "::error::Worker $check did not finish"
              status=1
              continue
            fi
            echo "::group::$check"
            cat "$RUNNER_TEMP/$check.log"
            echo "::endgroup::"
            if [ "$(cat "$RUNNER_TEMP/$check.status")" != 0 ]; then
              echo "::error::Worker $check failed"
              status=1
            fi
          done
          exit $status
