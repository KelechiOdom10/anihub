name: Production migrations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-migrations
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-migrations
    env:
      CLOUDFLARE_ACCOUNT_ID: ab6145b5f4d74c798229173319deaf21
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/worker
        run: |
          mkdir -p .void
          printf '{\n  "platform": "cloudflare"\n}\n' > .void/project.json
      - run: pnpm --filter @anihub/worker build
      - run: pnpm --filter @anihub/worker deploy:guard
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The runner has no OS keyring; without this the pinned cf CLI refuses
          # the API token and asks for libsecret instead.
          CLOUDFLARE_AUTH_USE_KEYRING: "false"
        run: |
          pnpm --filter @anihub/worker exec void db status
          pnpm --filter @anihub/worker exec void db migrate --remote
          pnpm --filter @anihub/worker exec void db status
