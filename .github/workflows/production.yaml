name: Production
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  latest:
    if: >-
      vars.ANIHUB_PRODUCTION_ACTIVE == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - id: tip
        name: Skip commits that main has moved past
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tip" = "$SHA" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; else echo "main is at $tip; skipping $SHA"; fi
  deploy:
    needs: latest
    if: needs.latest.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://anihub.kellycooks.dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ab6145b5f4d74c798229173319deaf21
      CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - working-directory: apps/worker
        run: |
          mkdir -p .void
          printf '{\n  "platform": "cloudflare"\n}\n' > .void/project.json
      - run: pnpm --filter @anihub/worker build
      - run: pnpm --filter @anihub/worker deploy:guard
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --filter @anihub/worker exec void deploy --platform cloudflare --skip-migrations
      - run: pnpm --filter @anihub/worker smoke https://anihub.kellycooks.dev
